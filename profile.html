<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>프로필 - Web Builder</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="font-sans m-0 bg-slate-50 pt-20">
    <nav class="fixed top-0 left-0 right-0 bg-white shadow-md z-40">
        <div class="flex justify-between items-center px-6 lg:px-20 py-4">
            <a href="index.html" class="flex items-center gap-2 hover:cursor-pointer group">
                <span class="text-white text-sm w-8 h-8 bg-gradient-to-br from-indigo-500 to-purple-500 rounded-lg flex items-center justify-center transition-transform duration-200 group-hover:scale-110">W</span>
                <span class="text-xl font-semibold bg-gradient-to-r from-indigo-600 to-purple-600 bg-clip-text text-transparent">Web Builder</span>
            </a>

            <div class="flex gap-6 items-center">
                <a href="templates.html" data-nav-link="templates.html" class="text-slate-600 font-normal hover:text-slate-800 transition-colors duration-200 hover:cursor-pointer">
                    템플릿
                </a>
                <a href="builder.html" data-nav-link="builder.html" class="text-slate-600 font-normal hover:text-slate-800 transition-colors duration-200 hover:cursor-pointer">
                    웹사이트 만들기
                </a>
                <a href="pricing.html" data-nav-link="pricing.html" class="text-slate-600 font-normal hover:text-slate-800 transition-colors duration-200 hover:cursor-pointer">
                    요금제
                </a>
                <a href="profile.html" data-nav-link="profile.html" class="flex items-center gap-2 px-4 py-2 text-sm font-medium text-indigo-600 transition-colors border border-indigo-200 rounded-lg bg-indigo-50 hover:bg-indigo-100 hover:cursor-pointer">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4">
                        <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                    <span>프로필</span>
                </a>
            </div>
        </div>
    </nav>

    <main class="min-h-screen max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
        <div class="mb-10">
            <h1 class="text-4xl font-bold text-slate-900 mb-3">프로필</h1>
            <p class="text-lg text-slate-600">계정과 저장된 웹사이트 프로젝트를 관리하세요!</p>
        </div>

        <!-- Welcome message -->
        <div id="welcome-message" class="hidden mb-10 w-full rounded-2xl border border-indigo-500 bg-indigo-100 px-6 py-4 text-left font-semibold shadow-sm"></div>
        
        <section class="bg-white rounded-2xl p-8 shadow-sm border border-slate-200 mb-8">
            <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-6">
                <div>
                    <h2 class="text-2xl font-semibold text-slate-900 mb-4">사용자 정보</h2>
                    <dl class="space-y-3">
                        <div>
                            <dt class="text-sm font-medium text-slate-500">표시명 (닉네임)</dt>
                            <dd id="profile-name" class="text-base font-semibold text-slate-900">로딩 중...</dd>
                        </div>
                        <div>
                            <dt class="text-sm font-medium text-slate-500">이메일</dt>
                            <dd id="profile-email" class="text-base font-semibold text-slate-900">로딩 중...</dd>
                        </div>
                    </dl>
                </div>

                <button id="logout-btn" type="button" class="inline-flex items-center justify-center gap-2 px-5 py-3 border-2 border-slate-300 text-slate-700 font-semibold rounded-xl hover:bg-slate-50 transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5">
                        <path d="m16 17 5-5-5-5"></path>
                        <path d="M21 12H9"></path>
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                    </svg>
                    로그아웃
                </button>
            </div>
        </section>

        <section class="bg-white rounded-2xl p-8 shadow-sm border border-slate-200">
            <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-6">
                <div>
                    <h2 class="text-2xl font-semibold text-slate-900">저장된 프로젝트</h2>
                    <p class="text-slate-600 mt-1">최신 프로젝트가 먼저 표시됩니다.</p>
                </div>
                <a href="builder.html" class="inline-flex items-center justify-center gap-2 px-5 py-3 bg-gradient-to-r from-indigo-600 to-purple-600 text-white font-semibold rounded-xl shadow-md hover:shadow-xl transition-all hover:-translate-y-0.5">
                    새 프로젝트
                </a>
            </div>

            <div id="projects-status" class="rounded-lg border border-slate-200 bg-slate-50 px-4 py-3 text-sm text-slate-600">
                프로젝트를 불러오는 중...
            </div>
            <div id="projects-list" class="mt-5 grid grid-cols-1 md:grid-cols-2 gap-4"></div>
        </section>
    </main>

    <script src="js/config.js"></script>
    <script src="js/navbar.js"></script>
    <script type="module" src="js/profile.js"></script>
</body>
</html>
