<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | WebBuilder</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-gradient-to-br from-indigo-50 via-white to-purple-50 flex items-center justify-center px-4">
    <main class="w-full py-10">
        <section class="w-full max-w-md mx-auto">
            <div class="text-center mb-8">
                <h1 class="text-4xl font-bold bg-gradient-to-r from-indigo-600 to-purple-600 bg-clip-text text-transparent mb-2">
                    WebBuilder
                </h1>
                <p id="authMessage" class="mt-2 text-lg text-gray-600">다시 오신 것을 환영합니다!</p>
            </div>

            <button type="button" onclick="window.location.href='index.html'" class="flex items-center gap-2 text-gray-600 hover:text-gray-900 mb-6 transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-arrow-left w-5 h-5">
                    <path d="m12 19-7-7 7-7"></path>
                    <path d="M19 12H5"></path>
                </svg>
                Back
            </button>

            <div class="bg-white rounded-2xl shadow-xl p-8 border border-gray-100">
                <div class="flex gap-2 mb-6 bg-gray-100 rounded-lg p-1">
                    <button type="button" id="loginTab" onclick="showAuthForm('login')" class="flex-1 py-2 px-4 rounded-md font-medium transition-all bg-white text-indigo-600 shadow-sm">
                        로그인
                    </button>
                    <button type="button" id="registerTab" onclick="showAuthForm('register')" class="flex-1 py-2 px-4 rounded-md font-medium transition-all text-gray-600 hover:text-gray-900">
                        회원가입
                    </button>
                </div>

                <form id="loginForm" class="space-y-4">
                    <div>
                        <label for="email" class="block text-sm font-medium text-gray-700 mb-1">
                            Email
                        </label>
                        <input
                            id="email"
                            type="email"
                            name="email"
                            placeholder="you@example.com"
                            required
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none transition-all"
                        >
                    </div>

                    <div>
                        <label for="password" class="block text-sm font-medium text-gray-700 mb-1">
                            Password
                        </label>
                        <input
                            id="password"
                            type="password"
                            name="password"
                            placeholder="••••••••"
                            required
                            minlength="6"
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none transition-all"
                        >
                    </div>

                    <button type="submit" class="w-full bg-gradient-to-r from-indigo-600 to-purple-600 text-white py-3 rounded-lg font-semibold hover:from-indigo-700 hover:to-purple-700 transition-all shadow-lg hover:shadow-xl">
                        로그인
                    </button>
                </form>

                <form id="registerForm" class="space-y-4 hidden">
                    <div>
                        <label for="name" class="block text-sm font-medium text-gray-700 mb-1">
                            Name
                        </label>
                        <input
                            id="name"
                            type="text"
                            name="name"
                            placeholder="John Doe"
                            required
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none transition-all"
                        >
                    </div>

                    <div>
                        <label for="register-email" class="block text-sm font-medium text-gray-700 mb-1">
                            Email
                        </label>
                        <input
                            id="register-email"
                            type="email"
                            name="email"
                            placeholder="you@example.com"
                            required
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none transition-all"
                        >
                    </div>

                    <div>
                        <label for="register-password" class="block text-sm font-medium text-gray-700 mb-1">
                            Password
                        </label>
                        <input
                            id="register-password"
                            type="password"
                            name="password"
                            placeholder="••••••••"
                            required
                            minlength="6"
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none transition-all"
                        >
                    </div>

                    <button type="submit" class="w-full bg-gradient-to-r from-indigo-600 to-purple-600 text-white py-3 rounded-lg font-semibold hover:from-indigo-700 hover:to-purple-700 transition-all shadow-lg hover:shadow-xl">
                        가입하기
                    </button>
                </form>
            </div>
        </section>
    </main>

    <script>
        const loginTab = document.getElementById('loginTab');
        const registerTab = document.getElementById('registerTab');
        const loginForm = document.getElementById('loginForm');
        const registerForm = document.getElementById('registerForm');
        const authMessage = document.getElementById('authMessage');

        function setActiveTab(activeTab, inactiveTab) {
            activeTab.className = 'flex-1 py-2 px-4 rounded-md font-medium transition-all bg-white text-indigo-600 shadow-sm';
            inactiveTab.className = 'flex-1 py-2 px-4 rounded-md font-medium transition-all text-gray-600 hover:text-gray-900';
        }

        function showAuthForm(mode) {
            const isLogin = mode === 'login';

            loginForm.classList.toggle('hidden', !isLogin);
            registerForm.classList.toggle('hidden', isLogin);
            authMessage.textContent = isLogin ? '다시 오신 것을 환영합니다!' : '새 계정을 만들어보세요!';
            setActiveTab(isLogin ? loginTab : registerTab, isLogin ? registerTab : loginTab);
        }
    </script>
</body>
</html>
