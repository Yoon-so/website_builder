<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preview - Web Builder</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: '#6366f1',
                        'brand-dark': '#4f46e5',
                        accent: '#8b5cf6',
                        ink: '#0f172a',
                        muted: '#64748b',
                        line: '#e2e8f0',
                        panel: '#ffffff',
                        canvas: '#f8fafc',
                        soft: '#eef2ff'
                    },
                    animation: {
                        'spin-slow': 'spin 1.1s linear infinite',
                        'pulse-fast': 'pulse-custom 1.5s ease-in-out infinite',
                    },
                    keyframes: {
                        'pulse-custom': {
                            '0%, 100%': { opacity: '0.35', transform: 'scale(0.86)' },
                            '50%': { opacity: '1', transform: 'scale(1)' },
                        }
                    },
                }
            }
        }
    </script>
    <style>
        .is-hidden {
            opacity: 0; 
            visibility: hidden; 
            pointer-events: none;
        } 
        
        .site-frame { 
            opacity: 0; 
            transition: opacity .520ms ease; 
        } 
        
        .site-frame.is-visible { opacity: 1; } 
        
        @keyframes preview-spin { 
            to { 
                transform: rotate(360deg); 
            } 
        } 
        
        .preview-spinner { animation: preview-spin 1.2s linear infinite; }
    </style>
</head>
<body class="m-0 min-h-screen bg-canvas text-ink font-sans antialiased">
    <!-- Header Navigation -->
    <header class="sticky top-0 z-50 bg-white border-b border-slate-200 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <!-- LEFT -->
            <div class="flex items-center gap-4">
                <a href="builder.html" class="flex items-center gap-2 px-3 py-2 text-slate-700 hover:bg-slate-100 rounded-lg transition">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-arrow-left w-5 h-5">
                        <path d="m12 19-7-7 7-7"></path>
                        <path d="M19 12H5"></path>
                    </svg>
                Back
                </a>
                <div class="h-6 w-px bg-slate-200"></div>
                <h1 class="font-semibold text-slate-900">사이트 미리보기</h1>
            </div>

            <!-- RIGHT -->
            <div class="flex items-center gap-2">
                <!-- view buttons -->
                <div class="flex bg-slate-100 p-1 rounded-lg">
                    <button class="px-2 py-1 bg-white rounded shadow text-indigo-600">Desktop</button>
                    <button class="px-2 py-1 text-slate-600 hover:text-slate-900">Tablet</button>
                    <button class="px-2 py-1 text-slate-600 hover:text-slate-900">Mobile</button>
                </div>

                <div class="w-px h-6 bg-slate-200 mx-2"></div>

                <button class="px-3 py-2 border border-slate-300 rounded-lg hover:bg-slate-50 transition">공유</button>    
                <a href="builder.html" class="px-3 py-2 bg-slate-700 text-white rounded-lg hover:bg-slate-800 transition">수정</a>
                <button id="save-project-btn" class="px-3 py-2 bg-gradient-to-r from-indigo-600 to-purple-600 text-white rounded-lg hover:shadow-lg transition">저장</button>      
            </div>    
        </div>
    </header>
    <main class="relative min-h-screen overflow-hidden"> 
        <!-- Loading section -->
        <section id="loading-screen" class="loading-screen fixed inset-0 z-10 flex items-center justify-center bg-gradient-to-b from-canvas/96 to-canvas/98 p-[96px_20px_28px] transition-all duration-[420ms] ease-in-out"> 
            <div class="absolute inset-0 bg-[radial-gradient(circle_at_20%_18%,rgba(99,102,241,0.16),transparent_30rem)] pointer-events-none"></div> 
            <div class="absolute inset-0 bg-[radial-gradient(circle_at_82%_20%,rgba(139,92,246,0.12),transparent_26rem)] pointer-events-none"></div>

            <div class="loader-card relative flex flex-col gap-6 w-full max-w-[760px] overflow-hidden rounded-2xl border border-line bg-panel p-7 shadow-[0_22px_60px_rgba(15,23,42,0.12)] before:absolute before:top-0 before:left-0 before:right-0 before:h-1 before:bg-gradient-to-r before:from-brand before:to-accent"> 
                
                <div class="hero-row grid grid-cols-[96px_minmax(0,1fr)] items-center gap-6 max-sm:grid-cols-1 max-sm:justify-items-center"> 
                    <div class="spinner-wrap flex h-24 w-24 items-center justify-center rounded-xl border border-[#ddd6fe] bg-gradient-to-br from-[#eef2ff] to-[#faf5ff] max-sm:h-[82px] max-sm:w-[82px]">
                        <div class="spinner h-[54px] w-[54px] rounded-full border-4 border-brand/16 border-t-brand animate-spin-slow"></div>
                    </div>
                    <div class="text-left max-sm:text-center">
                        <h2 class="text-[clamp(30px,5vw,48px)] font-black tracking-normal leading-[1.04] m-0 mb-2.5 text-ink">웹사이트 생성 중...</h2> 
                        <p class="text-muted text-base m-0 leading-[1.65]">AI가 웹사이트를 생성하고 있습니다. 잠시만 기다려 주세요.</p>
                    </div>
                </div>    
                
                <!-- Messages section -->
                <div class="message-panel rounded-xl p-4.5 text-left flex flex-col gap-3">
                    <div id="progress-message" class="message text-ink text-sm font-extrabold min-h-[22px]">요구사항을 분석 중입니다...</div> 
                
                    <div class="progress-meta flex items-center justify-between">
                        <div id="progress-percent" class="percentage text-[#4338ca] text-xs font-extrabold">8%</div>
                    </div>

                    <div class="progress-track h-3 w-full overflow-hidden rounded-full bg-slate-200"> 
                        <div id="progress-bar" class="h-full w-[8%] rounded-full bg-gradient-to-r from-brand to-accent transition-all duration-520 ease-out"></div>
                    </div> 
                </div>
            </div>
        </section>
        
        <!-- Error --> 
        <section id="error-screen" class="error-screen is-hidden fixed inset-0 z-50 flex items-center justify-center bg-gradient-to-b from-canvas/96 to-canvas/98 p-[96px_20px_28px] transition-all duration-[420ms] ease-in-out"> 
            <div class="w-full max-w-[540px] rounded-2xl border border-red-200 bg-panel p-8 text-center shadow-[0_22px_60px_rgba(15,23,42,0.08)]"> 
                <div class="mx-auto mb-4 flex h-12 w-12 items-center justify-center rounded-full bg-red-50 text-red-500 font-bold text-xl">!</div>
                <h2 class="text-2xl font-extrabold text-ink m-0">Website generation failed</h2> 
                <p id="error-detail" class="mt-3 text-muted text-sm leading-relaxed">Please check your settings and try again.</p>
                
                <button id="retry-btn" type="button" class="retry-btn mt-5 inline-flex items-center justify-center rounded-xl bg-gradient-to-br from-brand to-accent px-5 py-3 font-extrabold text-white no-underline shadow-[0_16px_32px_rgba(99,102,241,0.24)] hover:shadow-[0_20px_40px_rgba(99,102,241,0.28)] hover:-translate-y-0.5 transition-all duration-180 ease-out border-0 cursor-pointer">Retry</button>
            </div> 
        </section> 
        
        <!-- Preview --> 
        <iframe id="site-frame" title="Generated website preview" class="site-frame relative z-10 h-screen w-full border-0 bg-white block"> </iframe> 
    </main>

    <script src="js/config.js"></script>

    <script type="module">
        import { saveProject } from "./js/project-save.js";

        const PREVIEW_JOB_KEY = 'advanced-builder-preview-job';
        const progressMessages = [
            'Analyzing requirements...',
            'Creating website structure...',
            'Generating pages...',
            'Designing interface...',
            'Applying styles...',
            'Finalizing website...'
        ];

        const loadingScreen = document.getElementById('loading-screen');
        const errorScreen = document.getElementById('error-screen');
        const errorDetail = document.getElementById('error-detail');
        const retryBtn = document.getElementById('retry-btn');
        const siteFrame = document.getElementById('site-frame');
        const progressMessage = document.getElementById('progress-message');
        const progressBar = document.getElementById('progress-bar');
        const progressPercent = document.getElementById('progress-percent');

        let lastJobId = new URLSearchParams(window.location.search).get('job') || '';
        let animatedProgress = 8;
        let messageIndex = 0;
        let isComplete = false;

        function readJob() {
            try {
                return JSON.parse(localStorage.getItem(PREVIEW_JOB_KEY));
            } catch {
                return null;
            }
        }

        function updateProgress(progress, message) {
            const safeProgress = Math.max(0, Math.min(100, Number(progress) || 0));
            progressBar.style.width = `${safeProgress}%`;
            progressPercent.innerText = `${Math.round(safeProgress)}%`;
            progressMessage.innerText = message || progressMessages[messageIndex];
        }

        function showLoading(job) {
            errorScreen.classList.add('is-hidden');
            loadingScreen.classList.remove('is-hidden');
            siteFrame.classList.remove('is-visible');
            updateProgress(job?.progress || animatedProgress, job?.message || progressMessages[messageIndex]);
        }

        function showComplete(job) {

            if (!job.html) {
                showError({ error: 'Generated website HTML was empty.' });
                return;
            }
            isComplete = true;

            updateProgress(100, 'Finalizing website...');
            siteFrame.onload = () => {
                window.setTimeout(() => {
                    loadingScreen.classList.add('is-hidden');
                    errorScreen.classList.add('is-hidden');
                    siteFrame.classList.add('is-visible');
                }, 260);
            };
            siteFrame.srcdoc = job.html;
        }

        function showError(job) {
            loadingScreen.classList.add('is-hidden');
            siteFrame.classList.remove('is-visible');
            errorDetail.innerText = job?.error || 'Please check your settings and try again.';
            errorScreen.classList.remove('is-hidden');
        }

        function applyJob(job) {
            if (!job) {
                showLoading({
                    progress: animatedProgress,
                    message: progressMessages[messageIndex]
                });
                return;
            }

            if (lastJobId && job.id && job.id !== lastJobId) {
                return;
            }

            lastJobId = job.id || lastJobId;

            if (job.status === 'complete') {
                showComplete(job);
            } else if (job.status === 'failed') {
                showError(job);
            } else {
                showLoading(job);
            }
        }

        function tickLocalAnimation() {

            if (isComplete) return;

            const job = readJob();
            if (job && (!lastJobId || job.id === lastJobId)) {
                applyJob(job);
                return;
            }

            animatedProgress = Math.min(92, animatedProgress + 2);
            messageIndex = Math.min(progressMessages.length - 1, Math.floor(animatedProgress / 18));
            showLoading({
                progress: animatedProgress,
                message: progressMessages[messageIndex]
            });
        }

        retryBtn.addEventListener('click', () => {
            window.location.href = 'builder.html';
        });

        window.addEventListener('storage', event => {
            if (event.key !== PREVIEW_JOB_KEY) return;
            applyJob(readJob());
        });

        document.getElementById("save-project-btn").addEventListener("click", async () => {
            try {
                const job = JSON.parse(localStorage.getItem("advanced-builder-preview-job"));
                
                await saveProject({
                    title: job.state.siteName,
                    company: job.state.companyName,
                    html: job.html
                });

                alert("프로젝트가 저장되었습니다.");
            } catch(err) {
                console.error(err);
                alert(err.message);
            }
        });

        applyJob(readJob());
        window.setInterval(tickLocalAnimation, 900);
    </script>
</body>
</html>
